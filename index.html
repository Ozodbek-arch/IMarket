<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iMarket Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .logo {
            position: relative;
            display: flex;
            align-items: center;
            font-size: clamp(60px, 12vw, 150px);
            font-weight: 800;
            letter-spacing: -6px;
            color: #111111;
            cursor: pointer;
        }

        /* Harflar */
        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(50px) scale(0.7);
            filter: blur(10px);
            animation: showLetter 0.7s cubic-bezier(.17,.67,.3,1.3) forwards;
        }

        .letter:nth-child(1) {
            animation-delay: 0.1s;
        }

        .letter:nth-child(2) {
            animation-delay: 0.2s;
        }

        .letter:nth-child(3) {
            animation-delay: 0.3s;
        }

        .letter:nth-child(4) {
            animation-delay: 0.4s;
        }

        .letter:nth-child(5) {
            animation-delay: 0.5s;
        }

        .letter:nth-child(6) {
            animation-delay: 0.6s;
        }

        .letter:nth-child(7) {
            animation-delay: 0.7s;
        }

        @keyframes showLetter {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.7);
                filter: blur(10px);
            }

            70% {
                transform: translateY(-8px) scale(1.05);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* i ustidagi nuqta */
        .dot {
            position: absolute;
            top: -15px;
            left: 27px;
            width: 18px;
            height: 18px;
            background: #111;
            border-radius: 50%;
            opacity: 0;
            transform: scale(0);
            animation: dotAnimation 0.5s ease forwards;
            animation-delay: 1s;
        }

        @keyframes dotAnimation {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }

            70% {
                transform: scale(1.3) rotate(20deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        /* Pastdagi chiziq */
        .line {
            position: absolute;
            left: 0;
            bottom: -25px;
            width: 0;
            height: 4px;
            background: #111;
            border-radius: 20px;
            animation: lineAnimation 1s ease forwards;
            animation-delay: 1.2s;
        }

        @keyframes lineAnimation {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        /* Glow */
        .logo::after {
            content: "";
            position: absolute;
            inset: -30px;
            background: radial-gradient(
                circle,
                rgba(0,0,0,0.12),
                transparent 65%
            );
            opacity: 0;
            z-index: -1;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                opacity: 0.1;
                transform: scale(0.9);
            }

            50% {
                opacity: 0.35;
                transform: scale(1.1);
            }
        }

        /* Hover */
        .logo:hover {
            transform: scale(1.04);
            transition: 0.4s ease;
        }

        .logo:hover .letter {
            text-shadow:
                0 0 10px rgba(0,0,0,0.25),
                0 0 25px rgba(0,0,0,0.15);
        }

        /* Pastdagi yozuv */
        .subtitle {
            position: absolute;
            bottom: 80px;
            font-size: 12px;
            letter-spacing: 5px;
            color: #777;
            opacity: 0;
            animation: subtitleAnimation 1s ease forwards;
            animation-delay: 1.6s;
        }

        @keyframes subtitleAnimation {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Telefon uchun */
        @media (max-width: 600px) {
            .logo {
                font-size: 65px;
                letter-spacing: -4px;
            }

            .dot {
                width: 11px;
                height: 11px;
                top: -5px;
                left: 18px;
            }

            .line {
                bottom: -18px;
                height: 3px;
            }

            .subtitle {
                bottom: 60px;
                font-size: 9px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="logo">

        <span class="letter">i</span>
        <span class="letter">M</span>
        <span class="letter">a</span>
        <span class="letter">r</span>
        <span class="letter">k</span>
        <span class="letter">e</span>
        <span class="letter">t</span>

        <div class="dot"></div>
        <div class="line"></div>

    </div>

    <div class="subtitle">
        ACCESSORIES • ONLINE SHOP
    </div>

</body>
</html>
